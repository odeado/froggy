<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Froggy Arcade</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-wrap">
    <header id="hud">
      <div class="hud-group">
        <div class="hud-item" title="Vidas"><span class="icon">❤️</span> <span id="hud-lives">3</span></div>
        <div class="hud-item" title="Nivel"><span class="icon">⚡</span> Nivel <span id="hud-level">1</span></div>
      </div>
      <div class="hud-group">
        <div class="hud-item" title="Puntaje"><span class="icon">🏆</span> <span id="hud-score">0</span></div>
        <button id="btn-mute" class="hud-btn" title="Silenciar / Activar sonido">🔊</button>
      </div>
    </header>

    <div id="timer-wrap">
      <div id="timer-bar"></div>
    </div>

    <div id="canvas-wrap">
      <canvas id="game-canvas"></canvas>
    </div>

    <div id="dpad" aria-hidden="false">
      <button class="dpad-btn dpad-side" data-dir="left" aria-label="Izquierda">&#9664;</button>
      <div class="dpad-center">
        <button class="dpad-btn" data-dir="up" aria-label="Arriba">&#9650;</button>
        <button class="dpad-btn" data-dir="down" aria-label="Abajo">&#9660;</button>
      </div>
      <button class="dpad-btn dpad-side" data-dir="right" aria-label="Derecha">&#9654;</button>
    </div>
  </div>

  <div id="game-over" hidden>
    <div class="panel">
      <div class="panel-badge">🎮 GAME OVER</div>
      <h2 id="go-title">¡Fin del Juego!</h2>
      <div class="score-card">
        <div class="score-item">
          <span class="label">PUNTUAJE</span>
          <span class="val" id="go-score">0</span>
        </div>
        <div class="score-divider"></div>
        <div class="score-item">
          <span class="label">RÉCORD</span>
          <span class="val highlight" id="go-best">0</span>
        </div>
      </div>
      <button id="go-restart">🔄 JUGAR DE NUEVO</button>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
