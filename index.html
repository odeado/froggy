<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Froggy</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-wrap">
    <header id="hud">
      <div class="hud-item">Vidas: <span id="hud-lives">3</span></div>
      <div class="hud-item">Puntaje: <span id="hud-score">0</span></div>
      <div class="hud-item">Nivel: <span id="hud-level">1</span></div>
    </header>

    <div id="canvas-wrap">
      <canvas id="game-canvas"></canvas>
    </div>

    <div id="dpad" aria-hidden="false">
      <button class="dpad-btn" data-dir="up" aria-label="Arriba">&#9650;</button>
      <div class="dpad-row">
        <button class="dpad-btn" data-dir="left" aria-label="Izquierda">&#9664;</button>
        <button class="dpad-btn" data-dir="down" aria-label="Abajo">&#9660;</button>
        <button class="dpad-btn" data-dir="right" aria-label="Derecha">&#9654;</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
