<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Froggy Arcade</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-wrap">
    <header id="hud">
      <div class="hud-group">
        <div class="hud-item" title="Vidas"><span class="icon">❤️</span> <span id="hud-lives">3</span></div>
        <div class="hud-item" title="Nivel"><span class="icon">⚡</span> Nivel <span id="hud-level">1</span></div>
      </div>
      <div class="hud-group">
        <div class="hud-item" title="Puntaje"><span class="icon">🏆</span> <span id="hud-score">0</span></div>
        <button id="btn-mute" class="hud-btn" title="Silenciar / Activar sonido">🔊</button>
      </div>
      <div class="hud-group" id="hud-rival" hidden>
        <div class="hud-item" title="Metas del rival"><span class="icon">🐸</span> <span id="hud-rival-goals">0</span>/5</div>
      </div>
    </header>

    <div id="timer-wrap">
      <div id="timer-bar"></div>
    </div>

    <div id="canvas-wrap">
      <canvas id="game-canvas"></canvas>
    </div>

    <div id="dpad" aria-hidden="false">
      <button class="dpad-btn dpad-side" data-dir="left" aria-label="Izquierda">&#9664;</button>
      <div class="dpad-center">
        <button class="dpad-btn" data-dir="up" aria-label="Arriba">&#9650;</button>
        <button class="dpad-btn" data-dir="down" aria-label="Abajo">&#9660;</button>
      </div>
      <button class="dpad-btn dpad-side" data-dir="right" aria-label="Derecha">&#9654;</button>
    </div>
  </div>

  <div id="game-over" class="overlay" hidden>
    <div class="panel">
      <div class="panel-badge">🎮 GAME OVER</div>
      <h2 id="go-title">¡Fin del Juego!</h2>
      <div class="score-card">
        <div class="score-item">
          <span class="label">PUNTUAJE</span>
          <span class="val" id="go-score">0</span>
        </div>
        <div class="score-divider"></div>
        <div class="score-item">
          <span class="label">RÉCORD</span>
          <span class="val highlight" id="go-best">0</span>
        </div>
      </div>
      <button id="go-restart">🔄 JUGAR DE NUEVO</button>
    </div>
  </div>

  <!-- Selección de modo: un jugador o en línea -->
  <div id="mode-select" class="overlay">
    <div class="panel">
      <div class="panel-badge">🐸 FROGGY ARCADE</div>
      <h2>¿Cómo quieres jugar?</h2>
      <div class="mode-buttons">
        <button id="btn-mode-single" class="mode-btn">🎮 Un jugador</button>
        <button id="btn-mode-online" class="mode-btn">🌐 En línea (Beta)</button>
      </div>
    </div>
  </div>

  <!-- Crear o unirse a una sala en línea -->
  <div id="online-menu" class="overlay" hidden>
    <div class="panel">
      <div class="panel-badge">🌐 EN LÍNEA</div>
      <h2>Jugar con un amigo</h2>
      <div class="mode-buttons">
        <button id="btn-create-room" class="mode-btn">Crear sala</button>
        <div class="join-row">
          <input id="join-code-input" maxlength="4" placeholder="CÓDIGO" autocomplete="off" autocapitalize="characters" />
          <button id="btn-join-room" class="mode-btn small">Unirse</button>
        </div>
      </div>
      <button id="btn-online-back" class="link-btn">‹ Volver</button>
    </div>
  </div>

  <!-- Esperando a que el rival se conecte -->
  <div id="room-waiting" class="overlay" hidden>
    <div class="panel">
      <div class="panel-badge">🌐 SALA</div>
      <h2 id="waiting-title">Esperando rival…</h2>
      <div id="room-code-display" class="room-code" hidden></div>
      <p id="waiting-status" class="waiting-status"></p>
      <button id="btn-waiting-cancel" class="link-btn">Cancelar</button>
    </div>
  </div>

  <!-- Cuenta regresiva justo antes de arrancar la carrera -->
  <div id="countdown-overlay" class="overlay" hidden>
    <div id="countdown-number">3</div>
  </div>

  <!-- Resultado final de una partida en línea -->
  <div id="match-result" class="overlay" hidden>
    <div class="panel">
      <div class="panel-badge" id="match-result-badge">🏆 VICTORIA</div>
      <h2 id="match-result-title">¡Ganaste la carrera!</h2>
      <p id="match-result-detail" class="waiting-status"></p>
      <button id="btn-match-menu" class="mode-btn">Volver al menú</button>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
